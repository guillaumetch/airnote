anchor-spl = "=1.2.0"
anchor-litesvm = "=0.4.0"
litesvm = { version = "=0.11.0", features = ["precompiles"] }
p256 = { version = "=0.13.2", features = ["ecdsa"] }
solana-instructions-sysvar = "=3.0.1"
