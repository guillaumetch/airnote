name: Publish AIRNOTE APK

on:
  push:
    branches: [ 'gate-15-skr-reserve-plus' ]
    paths:
      - 'app/**'
      - '.github/workflows/publish-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure optional stable debug signing
        shell: bash
        env:
          AIRNOTE_ANDROID_KEYSTORE_B64: ${{ secrets.AIRNOTE_ANDROID_KEYSTORE_B64 }}
          AIRNOTE_ANDROID_KEYSTORE_PASSWORD_SECRET: ${{ secrets.AIRNOTE_ANDROID_KEYSTORE_PASSWORD }}
          AIRNOTE_ANDROID_KEY_ALIAS_SECRET: ${{ secrets.AIRNOTE_ANDROID_KEY_ALIAS }}
          AIRNOTE_ANDROID_KEY_PASSWORD_SECRET: ${{ secrets.AIRNOTE_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${AIRNOTE_ANDROID_KEYSTORE_B64:-}" ]]; then
            echo "Stable signing is not configured; using the runner debug key."
            exit 0
          fi

          : "${AIRNOTE_ANDROID_KEYSTORE_PASSWORD_SECRET:?AIRNOTE_ANDROID_KEYSTORE_PASSWORD is required}"
          : "${AIRNOTE_ANDROID_KEY_ALIAS_SECRET:?AIRNOTE_ANDROID_KEY_ALIAS is required}"
          : "${AIRNOTE_ANDROID_KEY_PASSWORD_SECRET:?AIRNOTE_ANDROID_KEY_PASSWORD is required}"

          printf '%s' "$AIRNOTE_ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/airnote-ci.jks"
          chmod 600 "$RUNNER_TEMP/airnote-ci.jks"
          echo "AIRNOTE_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/airnote-ci.jks" >> "$GITHUB_ENV"
          echo "AIRNOTE_ANDROID_KEYSTORE_PASSWORD=$AIRNOTE_ANDROID_KEYSTORE_PASSWORD_SECRET" >> "$GITHUB_ENV"
          echo "AIRNOTE_ANDROID_KEY_ALIAS=$AIRNOTE_ANDROID_KEY_ALIAS_SECRET" >> "$GITHUB_ENV"
          echo "AIRNOTE_ANDROID_KEY_PASSWORD=$AIRNOTE_ANDROID_KEY_PASSWORD_SECRET" >> "$GITHUB_ENV"

      - name: Build APK
        run: gradle assembleDebug

      - name: Prepare release asset
        run: cp app/build/outputs/apk/debug/app-debug.apk AIRNOTE.apk

      - name: Publish stable submission release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete airnote-submission --yes --cleanup-tag || true
          gh release create airnote-submission AIRNOTE.apk \
            --target "$GITHUB_SHA" \
            --title "AIRNOTE — Submission Build" \
            --notes "Latest functional AIRNOTE Android APK for Solana Mobile hackathon evaluation."
