name: Solana AIRNOTE

on:
  push:
    branches: [ gate-02-solana-vault ]
  pull_request:
    branches: [ gate-01-note-protocol ]

jobs:
  rust-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check program
        run: cargo check -p airnote-vault

      - name: Cross-language protocol tests
        run: cargo test -p airnote-vault --lib
