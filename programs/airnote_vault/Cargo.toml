[package]
name = "airnote-vault"
version = "0.1.0"
description = "AIRNOTE one-hop offline USDC vault and redemption program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "airnote_vault"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = [
    "anchor-lang/idl-build",
    "anchor-spl/idl-build",
]

[dependencies]
anchor-lang = { version = "=1.2.0", features = ["init-if-needed"] }
anchor-spl = "=1.2.0"
solana-instructions-sysvar = "=3.0.1"
solana-sha256-hasher = "=3.1.0"

[dev-dependencies]
anchor-litesvm = "=0.4.0"
litesvm-utils = "=0.4.0"
p256 = { version = "=0.13.2", features = ["ecdsa"] }
